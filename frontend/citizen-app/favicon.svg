<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#48cae4"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="#48cae4" stroke-width="8" />
  <rect x="40" y="40" width="432" height="432" rx="80" fill="none" stroke="#415a77" stroke-width="2" stroke-opacity="0.5" />

  <!-- Warning Waves / Early Warning Signals -->
  <path d="M 200 135 A 60 60 0 0 1 312 135" fill="none" stroke="url(#warnGrad)" stroke-width="7" stroke-linecap="round" />
  <path d="M 222 155 A 36 36 0 0 1 290 155" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="165" r="10" fill="#ef4444" stroke="#ffffff" stroke-width="3" filter="url(#glow)" />

  <!-- Mountain Peak 1 (Left/Back) -->
  <polygon points="90,390 210,210 330,390" fill="#2b4c6f" />
  <polygon points="210,210 240,255 210,245 180,255" fill="#90e0ef" opacity="0.9" />

  <!-- Mountain Peak 2 (Right/Fore) -->
  <polygon points="170,390 320,180 440,390" fill="#1b365d" stroke="#48cae4" stroke-width="3" />
  <polygon points="320,180 280,240 320,230 360,240" fill="#f0f9ff" />

  <!-- Ground / Sensor Line -->
  <line x1="70" y1="390" x2="442" y2="390" stroke="url(#cyanGlow)" stroke-width="6" stroke-linecap="round" />

  <!-- Live Pulse Beacon Pill -->
  <rect x="196" y="415" width="120" height="30" rx="15" fill="#22c55e" stroke="#ffffff" stroke-width="2" />
  <circle cx="216" cy="430" r="5" fill="#ffffff" />
  <text x="232" y="435" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">LIVE</text>
</svg>
