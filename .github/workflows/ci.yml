name: BhoomiSafe CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip & wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify ML Stack & Wheel Binary Integrity
        run: |
          python -c "
          import numpy as np
          import pandas as pd
          import sklearn
          import xgboost as xgb
          import fastapi
          import uvicorn
          print(f'Numpy: {np.__version__}')
          print(f'Pandas: {pd.__version__}')
          print(f'Scikit-Learn: {sklearn.__version__}')
          print(f'XGBoost: {xgb.__version__}')
          print('All ML wheels loaded successfully!')
          "

      - name: Test FastAPI Backend Startup & Prediction Inference
        run: |
          python -c "
          from backend.services.ml_service import ml_service
          print(f'Model Available: {ml_service.is_model_available}')
          test_payload = {
              'rainfall_24h_mm': 180.0,
              'rainfall_72h_mm': 390.0,
              'antecedent_rainfall_mm': 520.0,
              'soil_moisture_percent': 85.0,
              'slope_degrees': 38.0,
              'elevation_m': 1200,
              'ndvi': 0.32,
              'lithology_code': 2
          }
          res = ml_service.predict(test_payload)
          assert 'probability' in res
          assert 'risk_level' in res
          print('Test inference passed:', res)
          "

      - name: Run Backend Test Suite (pytest)
        run: |
          pytest tests/ -v


