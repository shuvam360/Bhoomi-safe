name: bhoomi-safe
channels:
  - conda-forge
  - defaults

dependencies:
  # ─── Python ───────────────────────────────────────────
  - python=3.11

  # ─── Data & ML (from ml/requirements.txt) ─────────────
  - numpy>=1.26.0
  - pandas>=2.0.0
  - scikit-learn>=1.4.0
  - matplotlib>=3.8.0
  - seaborn>=0.13.0
  - joblib>=1.3.0

  # ─── Backend (from backend/requirements.txt) ──────────
  - httpx>=0.26.0
  - python-dotenv>=1.0.0

  # ─── Pip-only packages ────────────────────────────────
  - pip
  - pip:
      # FastAPI stack
      - fastapi>=0.110.0
      - uvicorn[standard]>=0.27.0
      - pydantic>=2.6.0
      - python-multipart>=0.0.9
      # ML
      - xgboost>=2.0.0
      # Optional alert integrations (uncomment to enable)
      # - twilio>=8.0.0
      # - sendgrid>=6.11.0
