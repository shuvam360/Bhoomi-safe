[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bhoomi-safe"
version = "1.0.0"
description = "AI-Based Early Warning and Landslide Risk Monitoring System for North East India (NER)"
readme = "README.md"
requires-python = ">=3.11, <3.13"

license = { text = "MIT" }
authors = [
    { name = "BhoomiSafe Team", email = "team@bhoomi-safe.in" }
]
keywords = ["landslide", "early-warning", "machine-learning", "fastapi", "ner", "xgboost", "geotechnical"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    # Core API & Server
    "fastapi>=0.110.0,<0.120.0",
    "uvicorn[standard]>=0.27.0,<0.35.0",
    "pydantic>=2.6.0,<3.0.0",
    "httpx>=0.26.0,<1.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9,<0.2.0",
    
    # Machine Learning & Scientific Stack (Verified Stable Wheels for Python 3.11 & 3.12)
    "numpy>=1.26.4,<2.1.0",
    "pandas>=2.2.0,<3.0.0",
    "scikit-learn>=1.4.0,<1.6.0",
    "xgboost>=2.0.3,<2.2.0",
    "scipy>=1.12.0,<1.15.0",
    "joblib>=1.3.2,<1.5.0",
    
    # Visualization & Geotechnical Analytics
    "matplotlib>=3.8.0,<3.10.0",
    "seaborn>=0.13.0,<0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.3.0",
]
alerts = [
    "twilio>=8.12.0",
    "sendgrid>=6.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
]

